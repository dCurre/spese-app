name: Build & Release APK

on:
  push:
    branches: [ main ]

# Evita esecuzioni concorrenti che si pestano i piedi sul bump di VERSION.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # per committare VERSION e creare la Release/tag

jobs:
  release:
    runs-on: ubuntu-latest
    # Non rilanciare su commit di bump fatti dal workflow stesso.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determina versione (rispetta VERSION se modificata a mano)
        id: bump
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          # Il tag della versione corrente esiste già? (serve a distinguere primo rilascio / salti manuali)
          if git rev-parse "v${CURRENT}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
          else
            TAG_EXISTS="false"
          fi

          if [ "$TAG_EXISTS" = "false" ]; then
            # La versione corrente non è ancora stata rilasciata: pubblicala così com'è.
            # Copre il primo rilascio e i salti manuali (es. 1.0.0 scritto a mano in VERSION).
            NEW_VERSION="$CURRENT"
            BUMPED="false"
            echo "Pubblico la versione corrente: $NEW_VERSION (nessun incremento)"
          else
            # La versione corrente è già stata rilasciata: incrementa la patch.
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "$NEW_VERSION" > VERSION
            BUMPED="true"
            echo "Versione incrementata: $NEW_VERSION"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Commit del bump di versione
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "dCurre"
          git config user.email "davidecurreli4@gmail.com"
          git add VERSION
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ricrea google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Ricrea keystore di release
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Rendi gradlew eseguibile
        run: chmod +x gradlew

      - name: Build APK release firmato
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/spese-v${{ steps.bump.outputs.version }}.apk"

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: dist/spese-v${{ steps.bump.outputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
