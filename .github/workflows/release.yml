name: Build & Release APK

on:
  push:
    branches: [ main ]

# Evita esecuzioni concorrenti che si pestano i piedi sul bump di VERSION.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # per committare VERSION e creare la Release/tag

jobs:
  release:
    runs-on: ubuntu-latest
    # Non rilanciare su commit di bump fatti dal workflow stesso.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Leggi versione da VERSION
        id: bump
        run: |
          # Il bump è fatto localmente dallo script `scripts/ship.sh` (git ship):
          # VERSION arriva già incrementata nel commit. Qui si legge e basta.
          NEW_VERSION=$(cat VERSION | tr -d '[:space:]')
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "error: il tag v${NEW_VERSION} esiste già. Bumpare VERSION (git ship) prima di pushare." >&2
            exit 1
          fi
          echo "Pubblico la versione: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ricrea google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Ricrea keystore di release
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Rendi gradlew eseguibile
        run: chmod +x gradlew

      - name: Unit test
        # Se i test falliscono, la release NON viene pubblicata (il job si ferma qui).
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Build APK release firmato
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_BUGREPORT_TOKEN: ${{ secrets.BUGREPORT_TOKEN }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/spese-v${{ steps.bump.outputs.version }}.apk"

      - name: Estrai note di rilascio dal CHANGELOG
        id: notes
        run: |
          # Prende SOLO la sezione "## <versione>" da CHANGELOG.md (note parlanti per l'utente),
          # non i commit git. Se la sezione manca, usa un testo di fallback.
          VER="${{ steps.bump.outputs.version }}"
          NOTES=$(awk -v ver="## ${VER}" '
            $0 == ver {flag=1; next}
            /^## / && flag {flag=0}
            flag {print}
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES="Vedi il changelog completo su GitHub."
          fi
          # Scrive le note in un file da passare come body della release.
          printf '%s\n' "$NOTES" > release_notes.md
          echo "Note di rilascio per v${VER}:"
          cat release_notes.md

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: dist/spese-v${{ steps.bump.outputs.version }}.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
